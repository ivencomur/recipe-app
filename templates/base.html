{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe App</title>
        <div id="google_translate_element" style="position: absolute; top: 15px; left: 20px; z-index: 9999;"></div>
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: true
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <style>
        .goog-te-gadget-simple {
            background-color: rgba(255,255,255,0.2) !important;
            border: 1px solid rgba(255,255,255,0.5) !important;
            padding: 8px !important;
            border-radius: 4px !important;
        }
        .goog-te-gadget-simple a { color: white !important; text-decoration: none; }
        .goog-te-gadget-simple .goog-te-menu-value span { color: white !important; }
        /* Hide Google top bar */
        .goog-te-banner-frame { display: none !important; }
        body { top: 0px !important; }
    </style>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #20504b 0%, #2d7067 100%);
            min-height: 100vh;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
