{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Recipe App</title>
        <div id="google_translate_element" style="position: absolute; top: 15px; left: 20px; z-index: 9999;"></div>
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: true
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <style>
        .goog-te-gadget-simple {
            background-color: rgba(255,255,255,0.2) !important;
            border: 1px solid rgba(255,255,255,0.5) !important;
            padding: 8px !important;
            border-radius: 4px !important;
        }
        .goog-te-gadget-simple a { color: white !important; text-decoration: none; }
        .goog-te-gadget-simple .goog-te-menu-value span { color: white !important; }
        /* Hide Google top bar */
        .goog-te-banner-frame { display: none !important; }
        body { top: 0px !important; }
    </style>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #20504b 0%, #2d7067 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
        }
        .container {
            max-width: 1200px;
            margin: 80px auto 0;
            padding: 2rem;
            flex: 1;
            text-align: center;
        }
        .header h1 { font-size: 3.5rem; margin-bottom: 1rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .header .subtitle { font-size: 1.5rem; opacity: 0.9; margin-bottom: 3rem; }
        .auth-box {
            background: white;
            color: #333;
            max-width: 400px;
            margin: 0 auto;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            transition: transform 0.2s;
        }
        .btn-primary { background-color: #ffa061; color: white; }
        .btn-secondary { background-color: #20504b; color: white; }
        .btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Recipe App</h1>
            <p class="subtitle">Discover and Share Amazing Recipes</p>
        </div>
        <div class="auth-box">
            {% if user.is_authenticated %}
                <h3>Welcome back, {{ user.username }}!</h3>
                <br>
                <a href="{% url 'recipes:list' %}" class="btn btn-primary">View All Recipes</a>
                <form method="post" action="{% url 'logout' %}" style="margin:0;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-secondary">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-primary">Login</a>
                <a href="{% url 'sales:register' %}" class="btn btn-secondary">Register</a>
            {% endif %}
        </div>
    </div>
</body>
</html>
