{% extends "base.html" %}
{% load static %}
{% block content %}
<style>
  .recipe-list-container { max-width: 1400px; margin: 0 auto; padding: 2rem 1rem; position: relative; }
  
  /* Navigation Bar Styles */
  .nav-header {
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    margin-bottom: 2rem; 
    padding-bottom: 1rem; 
    border-bottom: 3px solid #ffa061;
    flex-wrap: wrap;
    gap: 15px;
  }
  
  .page-title { 
    color: white; 
    font-size: 2.5rem; 
    font-weight: 700; 
    margin: 0; 
    text-shadow: 1px 1px 3px rgba(0,0,0,0.2); 
    flex-grow: 1;
  }

  .nav-buttons {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .nav-btn {
    text-decoration: none;
    background: transparent;
    border: 2px solid #ffa061;
    color: #ffa061;
    font-weight: 600;
    padding: 0.5rem 1rem;
    border-radius: 20px;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.9rem;
  }

  .nav-btn:hover { background-color: #ffa061; color: white; }
  
  .logout-form { margin: 0; }

  /* Recipe Grid Styles */
  .recipes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem; }
  .recipe-card {
    background: white; border-radius: 12px; overflow: hidden;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); transition: transform 0.3s;
  }
  .recipe-card:hover { transform: translateY(-8px); }
  .recipe-image-wrapper { height: 250px; overflow: hidden; background: #f8f9fa; }
  .recipe-image-wrapper img { width: 100%; height: 100%; object-fit: cover; }
  .recipe-card-body { padding: 1.5rem; }
  .recipe-card-title a { color: #20504b; text-decoration: none; font-size: 1.25rem; font-weight: 600; }
  .cooking-time { color: #6c757d; margin-top: 10px; font-size: 0.9rem; }
</style>

<div class="recipe-list-container">
  <div class="nav-header">
    <h1 class="page-title">All Recipes ({{ recipes|length }})</h1>
    
    <div class="nav-buttons">
      <a href="{% url 'sales:home' %}" class="nav-btn">
        <span>🏠</span> Home
      </a>
      
      <form method="post" action="{% url 'logout' %}" class="logout-form">
        {% csrf_token %}
        <button type="submit" class="nav-btn">Logout</button>
      </form>
    </div>
  </div>

  <div class="recipes-grid">
    {% for recipe in recipes %}
    <div class="recipe-card">
      <div class="recipe-image-wrapper">
        <img src="{{ recipe.get_image_url }}" alt="{{ recipe.name }}" onerror="this.src='/static/img/no_picture.jpg'">
      </div>
      <div class="recipe-card-body">
        <h5 class="recipe-card-title">
          <a href="{% url 'recipes:detail' recipe.id %}">{{ recipe.name }}</a>
        </h5>
        {% if recipe.cook_time_minutes %}
        <div class="cooking-time">⏱️ {{ recipe.cook_time_minutes }} minutes</div>
        {% endif %}
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
