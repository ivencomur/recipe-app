{% extends "base.html" %}
{% block content %}
<style>
    .register-container {
        max-width: 500px;
        margin: 5rem auto;
        padding: 3rem;
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .register-title { 
        color: #20504b; 
        font-size: 2rem; 
        margin-bottom: 2rem; 
        text-align: center; 
    }
    .form-group { margin-bottom: 1rem; }
    .form-group input {
        width: 100%; padding: 0.75rem;
        border: 2px solid #ddd; border-radius: 8px; font-size: 1rem;
    }
    .form-group label {
        display: block; margin-bottom: 0.5rem; color: #20504b; font-weight: bold;
    }
    .helptext { display: block; font-size: 0.8rem; color: #666; margin-top: 5px; }
    .register-btn {
        width: 100%; padding: 1rem; background: #ffa061; color: white;
        border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer;
        margin-top: 1rem;
    }
    .register-btn:hover { background: #ff8c47; }
    .login-link { text-align: center; margin-top: 1.5rem; }
    .login-link a { color: #20504b; font-weight: bold; text-decoration: none; }
    ul.errorlist { color: #d9534f; list-style: none; padding: 0; font-size: 0.9rem; }
</style>

<div class="register-container">
    <h2 class="register-title">📝 Create Account</h2>
    
    <form method="post">
        {% csrf_token %}
        
        {% for field in form %}
        <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.help_text %}
            <span class="helptext">{{ field.help_text }}</span>
            {% endif %}
            {{ field.errors }}
        </div>
        {% endfor %}
        
        <button type="submit" class="register-btn">Register</button>
    </form>

    <div class="login-link">
        <p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>
    </div>
</div>
{% endblock %}
