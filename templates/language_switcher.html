{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
{% get_available_languages as LANGUAGES %}

<div class="language-switcher">
    <form action="{% url 'set_language' %}" method="post" id="lang-form">
        {% csrf_token %}
        <input name="next" type="hidden" value="{{ request.get_full_path|default:'/' }}">
        <select name="language" onchange="document.getElementById('lang-form').submit();" class="native-lang-select">
            {% for lang_code, lang_name in LANGUAGES %}
                <option value="{{ lang_code }}" {% if lang_code == LANGUAGE_CODE %}selected{% endif %}>
                    {{ lang_name }}
                </option>
            {% endfor %}
        </select>
    </form>
</div>
